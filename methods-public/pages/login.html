<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Attendance System</title>
    <link  rel="stylesheet" href="../styles/login.css" type="text/css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎓 Attendance System</h1>
            <p>Welcome! Please login or register to continue</p>
        </div>

        <!-- User Type Toggle -->
        <div class="user-type-toggle">
            <button class="user-type-btn active" data-type="student">👨‍🎓 Student</button>
            <button class="user-type-btn" data-type="professor">👨‍🏫 Professor</button>
        </div>

        <!-- Form Toggle -->
        <div class="form-toggle">
            <button class="toggle-btn active" data-form="login">Login</button>
            <button class="toggle-btn" data-form="register">Register</button>
        </div>

        <div class="form-container">
            <!-- Login Form -->
            <form class="form active" id="loginForm" action="/login" method="post">
                <div class="form-group">
                    <label for="loginUsername">Username <span class="required">*</span></label>
                    <input type="text" id="loginUsername" name="username" required>
                </div>
                <div class="form-group">
                    <label for="loginPassword">Password <span class="required">*</span></label>
                    <input type="password" id="loginPassword" name="password" required>
                </div>
                <button type="submit" class="submit-btn">Login</button>
            </form>

            <!-- Register Form -->
            <form class="form" id="registerForm" action="/register"  method="post">
                <input type="hidden" name="userType" id="userTypeField" value="student">
                <!-- Common Fields -->
                <div class="form-group">
                    <label for="regUsername">Username <span class="required">*</span></label>
                    <input type="text" id="regUsername" name="username" required>
                </div>
                <div class="form-group">
                    <label for="regEmail">Email <span class="required">*</span></label>
                    <input type="email" id="regEmail" name="email" required>
                </div>
                <div class="form-group">
                    <label for="regPassword">Password <span class="required">*</span></label>
                    <input type="password" id="regPassword" name="password" required>
                </div>
                <div class="form-group">
                    <label for="regConfirmPassword">Confirm Password <span class="required">*</span></label>
                    <input type="password" id="regConfirmPassword" name="confirmPassword" required>
                </div>

                <!-- Student Specific Fields -->
                <div class="student-fields active">
                    <div class="form-group">
                        <label for="studentName">Full Name <span class="required">*</span></label>
                        <input type="text" id="studentName" name="studentName" required>
                    </div>
                    <div class="form-group">
                        <label for="rollNumber">Roll Number <span class="required">*</span></label>
                        <input type="text" id="rollNumber" name="rollNumber" required>
                    </div>
                    <div class="form-group">
                        <label for="branch">Branch <span class="required">*</span></label>
                        <select id="branch" name="branch" required>
                            <option value="">Select Branch</option>
                            <option value="CSE">Computer Science Engineering</option>
                            <option value="ECE">Electronics & Communication</option>
                            <option value="ME">Mechanical Engineering</option>
                            <option value="CE">Civil Engineering</option>
                            <option value="EEE">Electrical & Electronics</option>
                        </select>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="section">Section <span class="required">*</span></label>
                            <select id="section" name="section" required>
                                <option value="">Select</option>
                                <option value="A">A</option>
                                <option value="B">B</option>
                                <option value="C">C</option>
                                <option value="D">D</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="year">Year <span class="required">*</span></label>
                            <select id="year" name="year" required>
                                <option value="">Select</option>
                                <option value="1">1st Year</option>
                                <option value="2">2nd Year</option>
                                <option value="3">3rd Year</option>
                                <option value="4">4th Year</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="studentPhone">Phone Number <span class="required">*</span></label>
                        <input type="tel" id="studentPhone" name="phoneNumber" required>
                    </div>
                </div>

                <!-- Professor Specific Fields -->
                <div class="professor-fields">
                    <div class="form-group">
                        <label for="professorName">Full Name <span class="required">*</span></label>
                        <input type="text" id="professorName" name="professorName" required>
                    </div>
                    <div class="form-group">
                        <label for="employeeId">Employee ID</label>
                        <input type="text" id="employeeId" name="employeeId">
                    </div>
                    <div class="form-group">
                        <label for="department">Department <span class="required">*</span></label>
                        <select id="department" name="department" required>
                            <option value="">Select Department</option>
                            <option value="CSE">Computer Science Engineering</option>
                            <option value="ECE">Electronics & Communication</option>
                            <option value="ME">Mechanical Engineering</option>
                            <option value="CE">Civil Engineering</option>
                            <option value="EEE">Electrical & Electronics</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="professorPhone">Phone Number</label>
                        <input type="tel" id="professorPhone" name="phoneNumber">
                    </div>
                </div>

                <button type="submit" class="submit-btn">Register</button>
            </form>
        </div>
    </div>

    <script src="../scripts/login.js"></script>
</body>
</html>
